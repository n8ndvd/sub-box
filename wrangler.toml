# Modify name if deploying multiple instances
name = "sub-box"

main = ".open-next/worker.js"

compatibility_date = "2024-09-26"
compatibility_flags = ["nodejs_compat"]

minify = true

assets = { directory = ".open-next/assets", binding = "ASSETS" }

# [placement]
# mode = "smart"

# Environment variables
# Modify these to use the correct environment variables
[vars]
ADMIN_USERNAME = "siryoung"
ADMIN_PASSWORD = "fuckdavid" # Change this to a secure password
JWT_SECRET = "3d0de3f3-5759-4b78-b94e-36c98454" # Change this to a secure secret key
SESSION_TAG = "0"
SESSION_DURATION = "7d"
DEPLOY_TARGET = "cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "starlink" # Change this to the name of your D1 database
database_id = "faa9feec-6fd5-4f7b-8cb4-c2fd95b31413" # wrangler d1 info <YOUR_DATABASE_NAME>

[observability.logs]
enabled = true

